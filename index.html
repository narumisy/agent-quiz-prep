<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent 智能体竞赛自测</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <main class="card" id="questionCard">
      <div class="question-meta">
        <span class="badge" id="typeBadge">单选</span>
        <span class="badge category" id="categoryBadge">系统设计</span>
        <span class="badge" id="answerStatus" style="display:none"></span>
      </div>
      <h2 class="question-text" id="questionText"></h2>
      <div class="options" id="optionsList"></div>

      <div class="feedback" id="feedback" style="display:none"></div>

      <div class="actions">
        <button class="btn btn-primary" id="submitBtn">提交答案</button>
        <button class="btn btn-next" id="nextBtn" style="display:none">下一题</button>
      </div>
    </main>

    <header class="header">
      <h1>Agent 智能体竞赛自测</h1>
      <p class="subtitle">一次一题 · 即时批改 · 考前冲刺</p>
    </header>

    <div class="stats-bar">
      <div class="stat">
        <span class="stat-label">进度</span>
        <span class="stat-value" id="progressText">0/0</span>
      </div>
      <div class="stat">
        <span class="stat-label">本轮答对</span>
        <span class="stat-value correct" id="correctCount">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">本轮答错</span>
        <span class="stat-value wrong" id="wrongCount">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">累计正确率</span>
        <span class="stat-value" id="cumRate">--</span>
      </div>
    </div>

    <div class="mode-bar">
      <button class="mode-btn active" id="modeAll">全部题目</button>
      <button class="mode-btn" id="modeWrong">错题重练<span class="wrong-badge" id="wrongBadge" style="display:none"></span></button>
    </div>

    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <footer class="footer">
      <p id="footerText"></p>
    </footer>
  </div>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
